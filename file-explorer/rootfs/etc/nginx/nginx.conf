# Run nginx in foreground.
daemon off;

# This is run inside Docker.
user root;

# Pid storage location.
pid /var/run/nginx.pid;

# Set number of worker processes.
worker_processes 1;

# Enables the use of JIT for regular expressions to speed-up their processing.
pcre_jit on;

# Write error log to the app log.
error_log /proc/1/fd/1 error;

# Max num of simultaneous connections by a worker process.
events {
    worker_connections 512;
}

http {
    include /etc/nginx/includes/mime.types;

    access_log              off;
    client_max_body_size    0;
    default_type            application/octet-stream;
    gzip                    on;
    keepalive_timeout       65;
    sendfile                on;
    server_tokens           off;
    tcp_nodelay             on;
    tcp_nopush              on;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Home Assistant names the person behind an Ingress request in
    # X-Remote-User-Name, and identifies them in X-Remote-User-Id. Neither can
    # be reached by a browser: the Supervisor sets them itself and drops any
    # copy that arrived with the request.
    #
    # File Browser takes the name it is handed as the account to sign in, and
    # makes the account if it is the first time it sees the name. One name is
    # kept out of its reach: "admin" is the account this app makes for the
    # password login on the published port, and File Browser refuses to sign
    # somebody in to an account that was made for a different login method.
    # A Home Assistant user by that name, or one without a name at all, is
    # known by their user id instead, which is hexadecimal and never collides.
    map $http_x_remote_user_name $file_explorer_ha_user_name {
        default  $http_x_remote_user_name;
        ""       "";
        "admin"  "";
    }

    map $file_explorer_ha_user_name $file_explorer_ingress_user {
        ""       $http_x_remote_user_id;
        default  $file_explorer_ha_user_name;
    }

    include /etc/nginx/includes/upstream.conf;
    include /etc/nginx/servers/*.conf;
}
